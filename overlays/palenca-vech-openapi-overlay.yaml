overlay: 1.0.0
info:
  title: API Evangelist enrichment overlay for Palenca API
  version: 1.0.0
  x-generated: '2026-07-20'
  x-method: generated
  x-source: >-
    Derived from Palenca developer docs (environments-and-authentication, rate-limits)
    to add the servers[] and securityScheme the published OpenAPI omits. Does not
    mutate the original openapi/palenca-vech-openapi.json.
extends: ../openapi/palenca-vech-openapi.json
actions:
- target: $
  description: Add production and sandbox servers documented at developers.palenca.com.
  update:
    servers:
    - url: https://api.palenca.com
      description: Production
    - url: https://sandbox.palenca.com
      description: Sandbox (magic identifiers)
- target: $.components
  description: Declare the x-api-key security scheme (docs-documented; absent in the spec).
  update:
    securitySchemes:
      api_key:
        type: apiKey
        in: header
        name: x-api-key
        description: >-
          Private API key issued per environment; retrieve from
          https://console.palenca.com/developers/api
- target: $.info
  description: Annotate transport and rate-limit facts.
  update:
    x-transport:
      tls_min_version: '1.3'
      content_type: application/json
    x-rate-limit:
      limit: 120
      window_seconds: 60
      headers: [X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset]
