aid: palenca-vech
name: Palenca (Vech)
description: >-
  Palenca is a Latin American income and employment verification API (headquartered
  in Mexico, backed by 500 Global). Through a single REST API and an embeddable Widget,
  workers securely connect their gig-economy platform (Uber, Rappi, DiDi, inDriver,
  iFood, PedidosYa) and formal-economy sources (IMSS, ISSSTE, CDT/Carteira de Trabalho)
  to share verified income, earnings, employment history, and account data with fintechs,
  banks, and lenders. Palenca serves Mexico and Brazil, exposes users, accounts, logins,
  earnings, consents, insights, and webhooks resources, and ships a JS/CDN/ES6 widget
  and mobile SDKs for end-user account linking.
