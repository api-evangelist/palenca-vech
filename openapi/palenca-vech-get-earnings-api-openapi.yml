openapi: 3.2.0
info:
  title: Palenca Get Earnings API
  description: Palenca API
  version: 2.0.0
tags:
- name: Get Earnings
paths:
  /v1/get-earnings:
    post:
      tags:
      - Get Earnings
      summary: Get Daily Earnings
      operationId: get_daily_earnings_v1_get_earnings_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDailyEarningsParams'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse_AccountDataBaseResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    GetDailyEarningsParams:
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
      type: object
      required:
      - platform
      title: GetDailyEarningsParams
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    BaseResponse_AccountDataBaseResponse_:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error:
          $ref: '#/components/schemas/ErrorResponse'
        data:
          $ref: '#/components/schemas/AccountDataBaseResponse'
      type: object
      title: BaseResponse[AccountDataBaseResponse]
      example:
        success: true
        data: {}
        error: {}
    ErrorDetailResponse:
      properties:
        message:
          type: string
          title: Message
        location:
          type: string
          title: Location
      type: object
      title: ErrorDetailResponse
    CountryCode:
      enum:
      - mx
      - co
      - br
      - ar
      - cl
      - pe
      - us
      - cr
      - pa
      - ec
      - bo
      - ve
      - sv
      - do
      title: CountryCode
      description: An enumeration.
    LoginTypes:
      enum:
      - curp
      - otp
      - totp
      - pilot
      - email_otp
      - credentials
      - phone_voice_otp
      - phone_whatsapp_otp
      title: LoginTypes
      description: An enumeration.
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        errors:
          items:
            $ref: '#/components/schemas/ErrorDetailResponse'
          type: array
          title: Errors
      type: object
      title: ErrorResponse
    AccountDataBaseResponse:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        country:
          $ref: '#/components/schemas/CountryCode'
        platform:
          $ref: '#/components/schemas/PlatformCode'
        account_id:
          type: string
          format: uuid
          title: Account Id
        next_step:
          $ref: '#/components/schemas/LoginTypes'
        methods:
          items:
            $ref: '#/components/schemas/LoginTypes'
          type: array
          default: []
        alternative_methods:
          items:
            $ref: '#/components/schemas/LoginTypes'
          type: array
          default: []
        hint:
          type: string
          title: Hint
      type: object
      title: AccountDataBaseResponse
      example:
        user_id: 9334389a-c93c-4183-9894-ea8eb72f82e8
        country: mx
        platform: uber
    PlatformCode:
