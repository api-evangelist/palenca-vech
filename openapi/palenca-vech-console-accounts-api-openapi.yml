  /console/companies/{company_id}/accounts/{account_id}/raw-data:
    get:
      tags:
      - console/accounts
      summary: Get Raw Data
      operationId: get_raw_data_console_companies__company_id__accounts__account_id__raw_data_get
      parameters:
      - required: true
        schema:
          type: string
          format: uuid
