components:
  schemas:
    IdType:
      enum:
      - tax
      - passport
      - national
      - social_security_number
      - individual_taxpayer_registry
      title: IdType
      description: An enumeration.
    LoginStatus:
      enum:
      - created
      - success
      - retry
      - incomplete
      - error
      - pending
      - requires_auth
      - profile_unavailable
      - error_credentials
      - error_otp
      - pending_for_data
      - validation_pending
      - password_validation_pending
      title: LoginStatus
      description: An enumeration.
    EarningDetailConsoleResponse:
      properties:
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        id:
          type: string
          format: uuid
          title: Id
        account_id:
          type: string
          format: uuid
          title: Account Id
        amount:
          type: number
          title: Amount
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        earning_date:
          type: string
          format: date-time
          title: Earning Date
        cash_amount:
          type: number
          title: Cash Amount
        count_trips:
          type: integer
          title: Count Trips
        employer:
          type: string
          title: Employer
        debt:
          type: number
          title: Debt
        metadata:
          type: object
          title: Metadata
      type: object
      required:
      - account_id
      - amount
      - currency
      - earning_date
      title: EarningDetailConsoleResponse
      currency: mxn
      cash_amount: 10.0
      count_trips: 2
      earning_date: '2022-05-02'
      amount: 100.0
    EmploymentHistoryStatus:
      enum:
      - empty
      - partial
      - complete
      title: EmploymentHistoryStatus
      description: An enumeration.
    EmploymentFilesType:
      enum:
      - imss_employment_record
      - imss_rpci_pdf
      - buro_insights_employment_record
      - issste_employment_file
      - end_of_rights_pdf
      title: EmploymentFilesType
      description: An enumeration.
    BaseResponse_AccountsDataConsoleResponse_:
