          type: integer
          title: Page
          default: 1
        name: page
        in: query
      - required: false
        schema:
          type: integer
          title: Items Per Page
          default: 100
        name: items_per_page
        in: query
      - required: false
        schema:
          type: string
          title: Order By
          default: -created_at
        name: order_by
        in: query
      - required: false
        schema:
          type: string
          title: Query
        name: query
        in: query
      - required: false
        schema:
          $ref: '#/components/schemas/LoginStatus'
        name: status
        in: query
      - required: false
        schema:
          type: string
          title: From Date
        name: from_date
        in: query
      - required: false
        schema:
          type: string
          title: To Date
        name: to_date
        in: query
      - required: false
