        name: items_per_page
        in: query
      - required: false
        schema:
          type: string
          title: Order By
          default: -created_at
        name: order_by
        in: query
      - required: false
        schema:
          type: string
          title: Query
        name: query
        in: query
      - required: false
        schema:
          $ref: '#/components/schemas/LoginStatus'
        name: status
        in: query
      - required: false
        schema:
          type: string
          title: From Date
        name: from_date
        in: query
      - required: false
        schema:
          type: string
          title: To Date
        name: to_date
        in: query
      - required: false
        schema:
          type: string
          title: Date Field
          default: created_at
        name: date_field
        in: query
      - required: false
        schema:
          $ref: '#/components/schemas/LoginSourceCode'
        name: source
        in: query
      - required: false
