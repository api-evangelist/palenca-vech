          default: true
        error:
          $ref: '#/components/schemas/ErrorResponse'
        data:
          $ref: '#/components/schemas/AccountsDataConsoleResponse'
      type: object
      title: BaseResponse[AccountsDataConsoleResponse]
      example:
        success: true
        data: {}
        error: {}
    CountryCode:
