      description: An enumeration.
    ErrorDetailResponse:
      properties:
        message:
          type: string
          title: Message
        location:
          type: string
          title: Location
      type: object
      title: ErrorDetailResponse
    InsightsStatus:
      enum:
      - computed_not_saved
      - incomplete
      - success
      - error
      title: InsightsStatus
      description: An enumeration.
    RetryLoginOptions:
      properties:
        force_retry:
          type: boolean
          title: Force Retry
          default: false
      type: object
      title: RetryLoginOptions
    WorkerParams:
      properties:
        id:
          type: string
          title: Id
      type: object
      required:
      - id
      title: WorkerParams
    UpdateLoginParams:
      properties:
        status:
          $ref: '#/components/schemas/LoginStatus'
        status_details:
          $ref: '#/components/schemas/StatusDetails'
        insights_status:
          $ref: '#/components/schemas/InsightsStatus'
        insights_status_details:
          $ref: '#/components/schemas/InsightsStatusDetails'
        should_notify_webhook:
          type: boolean
          title: Should Notify Webhook
          default: false
        login_id:
          type: string
          format: uuid
          title: Login Id
      type: object
      title: UpdateLoginParams
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    BaseResponse_AccountBaseResponse_:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error:
          $ref: '#/components/schemas/ErrorResponse'
        data:
          $ref: '#/components/schemas/AccountBaseResponse'
      type: object
      title: BaseResponse[AccountBaseResponse]
      example:
        success: true
        data: {}
        error: {}
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        errors:
          items:
            $ref: '#/components/schemas/ErrorDetailResponse'
          type: array
          title: Errors
      type: object
      title: ErrorResponse
    IdInfoParams:
      properties:
        type:
          $ref: '#/components/schemas/IdType'
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
      type: object
      required:
      - type
      - id
      - name
      title: IdInfoParams
    EmploymentDataParams:
      properties:
        account_id:
          type: string
          format: uuid
          title: Account Id
        worker:
          $ref: '#/components/schemas/WorkerParams'
        id_info:
          $ref: '#/components/schemas/IdInfoParams'
        profile:
          $ref: '#/components/schemas/ProfileParams'
      type: object
      title: EmploymentDataParams
    WorkerRole:
      enum:
      - driver
      - courier
      - both
