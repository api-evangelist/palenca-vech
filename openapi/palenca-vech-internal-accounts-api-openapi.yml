      description: An enumeration.
    BaseResponse:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error:
          $ref: '#/components/schemas/ErrorResponse'
        data:
          title: Data
      type: object
      title: BaseResponse
      example:
        success: true
        data: {}
        error: {}
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProfileParams:
      properties:
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        id:
          type: string
          format: uuid
          title: Id
        account_id:
          type: string
          format: uuid
          title: Account Id
        first_name:
          type: string
          title: First Name
        last_name:
          type: string
          title: Last Name
        phone:
          type: string
          title: Phone
        email:
          type: string
          title: Email
        address:
          type: string
          title: Address
        city_name:
          type: string
          title: City Name
        birthday:
          type: string
          format: date
          title: Birthday
        civil_status:
          $ref: '#/components/schemas/CivilStatus'
        gender:
          $ref: '#/components/schemas/Gender'
        worker_role:
          $ref: '#/components/schemas/WorkerRole'
        picture_url:
          type: string
          title: Picture Url
      type: object
      required:
      - account_id
      - first_name
      - last_name
      title: ProfileParams
    AccountWarning:
      enum:
      - banned
      - not_registered
      - profile_unavailable
      - needs_auth
      - no_employment_records
      - missing_social_security_number
      - social_security_number_mismatch
      - curp_has_inconsistencies
      - curp_not_in_platform
      - zero_quoted_weeks
      - rpci_backup_process
      - web_scraping_backup_process
      - rider_account
      - fleet_account
      - onboarding
      - didi_auth_app
      - didi_auth_web
      - invalid_captcha
      - incomplete_profile_data
      - id_mismatch
