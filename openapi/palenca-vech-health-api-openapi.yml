openapi: 3.1.0
info:
  title: Palenca accounts health API
  description: Palenca API
  version: 2.0.0
tags:
- name: health
paths:
  /v1/health/{platform_code}:
    get:
      tags:
      - health
      summary: Get Platform Health
      operationId: get_platform_health_v1_health__platform_code__get
      parameters:
      - required: true
        schema:
          $ref: '#/components/schemas/PlatformCode'
        name: platform_code
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    PlatformCode:
