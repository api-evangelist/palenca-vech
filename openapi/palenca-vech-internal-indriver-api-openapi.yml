openapi: 3.1.0
info:
  title: Palenca accounts internal/indriver API
  description: Palenca API
  version: 2.0.0
tags:
- name: internal/indriver
paths:
  /v1/internal/indriver/reprocess-events:
    post:
      tags:
      - internal/indriver
      summary: Reprocess inDriver events for accounts in a timeframe
      description: Reprocesses events for all inDriver accounts created in the specified month/year. This will extract events from earnings data that may have been missed. Deduplication ensures no duplicate events are created.
      operationId: reprocess_indriver_events_v1_internal_indriver_reprocess_events_post
      parameters:
      - required: false
        schema:
          type: string
          title: X-Api-Key
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReprocessEventsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse_ReprocessEventsResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ErrorDetailResponse:
      properties:
        message:
          type: string
          title: Message
        location:
          type: string
          title: Location
      type: object
      title: ErrorDetailResponse
    ReprocessEventsRequest:
      properties:
        year:
          type: integer
          maximum: 2030.0
          minimum: 2020.0
          title: Year
          description: Year (e.g., 2024)
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
          description: Month (1-12)
      type: object
      required:
      - year
      - month
      title: ReprocessEventsRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ReprocessEventsResponse:
      properties:
        total_accounts:
          type: integer
          title: Total Accounts
        processed:
          type: integer
          title: Processed
        errors:
          type: integer
          title: Errors
        error_details:
          items:
            type: object
          type: array
          title: Error Details
          default: []
      type: object
      required:
      - total_accounts
      - processed
      - errors
      title: ReprocessEventsResponse
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        errors:
          items:
            $ref: '#/components/schemas/ErrorDetailResponse'
          type: array
          title: Errors
      type: object
      title: ErrorResponse
    BaseResponse_ReprocessEventsResponse_:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error:
          $ref: '#/components/schemas/ErrorResponse'
        data:
          $ref: '#/components/schemas/ReprocessEventsResponse'
      type: object
      title: BaseResponse[ReprocessEventsResponse]
      example:
        success: true
        data: {}
        error: {}
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
