components:
  schemas:
    BaseResponse_GroupResponse_:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error:
          $ref: '#/components/schemas/ErrorResponse'
        data:
          $ref: '#/components/schemas/GroupResponse'
      type: object
      title: BaseResponse[GroupResponse]
      example:
        success: true
        data: {}
        error: {}
    AccountDataWithExternalIDBaseResponse:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        country:
          $ref: '#/components/schemas/CountryCode'
        platform:
          $ref: '#/components/schemas/PlatformCode'
        account_id:
          type: string
          format: uuid
          title: Account Id
        next_step:
          $ref: '#/components/schemas/LoginTypes'
        methods:
          items:
            $ref: '#/components/schemas/LoginTypes'
          type: array
          default: []
        alternative_methods:
          items:
            $ref: '#/components/schemas/LoginTypes'
          type: array
          default: []
        hint:
          type: string
          title: Hint
        external_id:
          type: string
          title: External Id
      type: object
      title: AccountDataWithExternalIDBaseResponse
      example:
        user_id: 9334389a-c93c-4183-9894-ea8eb72f82e8
        country: mx
        platform: uber
    IdType:
      enum:
      - tax
      - passport
      - national
      - social_security_number
      - individual_taxpayer_registry
      title: IdType
      description: An enumeration.
    AccountBaseResponse:
      properties:
        account_id:
          type: string
          format: uuid
          title: Account Id
        country:
          $ref: '#/components/schemas/CountryCode'
        platform:
          $ref: '#/components/schemas/PlatformCode'
        identifier:
          type: string
          title: Identifier
        worker_id:
          type: string
          title: Worker Id
        gov_id:
          type: string
          title: Gov Id
        last_successful_connection:
          type: string
          format: date-time
          title: Last Successful Connection
        warning:
          $ref: '#/components/schemas/AccountWarning'
        status:
          $ref: '#/components/schemas/LoginStatus'
        status_details:
          $ref: '#/components/schemas/StatusDetails'
        message:
          type: string
          title: Message
        recommendation:
          type: string
          title: Recommendation
        next_step:
          $ref: '#/components/schemas/LoginTypes'
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - account_id
      title: AccountBaseResponse
    LoginStatus:
      enum:
      - created
      - success
      - retry
      - incomplete
      - error
      - pending
      - requires_auth
      - profile_unavailable
      - error_credentials
      - error_otp
      - pending_for_data
      - validation_pending
      - password_validation_pending
      title: LoginStatus
      description: An enumeration.
    InsightsReport:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        account_id:
          type: string
          format: uuid
          title: Account Id
        success:
          type: boolean
          title: Success
          default: false
        warning:
          type: string
          title: Warning
        status:
          type: string
          title: Status
        last_base_salary:
          type: number
          title: Last Base Salary
        last_employment_duration:
          type: integer
          title: Last Employment Duration
        current_situation_duration:
          type: integer
          title: Current Situation Duration
        total_worked_weeks:
          type: integer
          title: Total Worked Weeks
        total_unique_employers:
          type: integer
          title: Total Unique Employers
        ratio_employers_per_year:
          type: number
          title: Ratio Employers Per Year
        total_weeks_unemployed:
          type: integer
          title: Total Weeks Unemployed
        max_unemployed_duration:
          type: integer
          title: Max Unemployed Duration
        current_employer_modifications:
          type: integer
          title: Current Employer Modifications
        median_progression:
          type: number
          title: Median Progression
        employer_change_modifications_positive_progression:
          type: number
          title: Employer Change Modifications Positive Progression
        employer_change_modifications_negative_progression:
          type: number
          title: Employer Change Modifications Negative Progression
        snapshots_1_year_ago:
          type: number
          title: Snapshots 1 Year Ago
        snapshots_3_years_ago:
          type: number
          title: Snapshots 3 Years Ago
