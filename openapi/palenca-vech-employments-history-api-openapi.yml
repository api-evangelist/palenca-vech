openapi: 3.2.0
info:
  title: Palenca Employments History API
  description: Palenca API
  version: 2.0.0
tags:
- name: Employments History
paths:
  /v1/employments-history:
    post:
      tags:
      - Employments History
      summary: Create Employment History
      operationId: create_employment_history_v1_employments_history_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmploymentHistoryParams'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse_EmploymentHistoryBaseResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ErrorDetailResponse:
      properties:
        message:
          type: string
          title: Message
        location:
          type: string
          title: Location
      type: object
      title: ErrorDetailResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AccountWarning:
      enum:
      - banned
      - not_registered
      - profile_unavailable
      - needs_auth
      - no_employment_records
      - missing_social_security_number
      - social_security_number_mismatch
      - curp_has_inconsistencies
      - curp_not_in_platform
      - zero_quoted_weeks
      - rpci_backup_process
      - web_scraping_backup_process
      - rider_account
      - fleet_account
      - onboarding
      - didi_auth_app
      - didi_auth_web
      - invalid_captcha
      - incomplete_profile_data
      - id_mismatch
      title: AccountWarning
      description: An enumeration.
    BaseResponse_EmploymentHistoryBaseResponse_:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error:
          $ref: '#/components/schemas/ErrorResponse'
        data:
          $ref: '#/components/schemas/EmploymentHistoryBaseResponse'
      type: object
      title: BaseResponse[EmploymentHistoryBaseResponse]
      example:
        success: true
        data: {}
        error: {}
    EmploymentHistoryBaseResponse:
      properties:
        employer:
          type: string
          title: Employer
        employer_registration:
          type: string
          title: Employer Registration
        start_date:
          anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
          title: Start Date
        end_date:
          anyOf:
          - type: string
            format: date
          - type: string
            format: date-time
          title: End Date
        job_title:
          type: string
          title: Job Title
        job_title_code:
          type: string
          title: Job Title Code
        federal_entity:
          type: string
          title: Federal Entity
      type: object
      title: EmploymentHistoryBaseResponse
    CreateEmploymentHistoryParams:
      properties:
        account_id:
          type: string
          title: Account Id
        jobs:
          items:
            $ref: '#/components/schemas/Job'
          type: array
          title: Jobs
        quoted_weeks:
          type: integer
          title: Quoted Weeks
        discounted_weeks:
          type: integer
          title: Discounted Weeks
        reintegrated_weeks:
          type: integer
          title: Reintegrated Weeks
        account_warning:
          $ref: '#/components/schemas/AccountWarning'
      type: object
      required:
      - account_id
      title: CreateEmploymentHistoryParams
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        errors:
          items:
            $ref: '#/components/schemas/ErrorDetailResponse'
          type: array
          title: Errors
      type: object
      title: ErrorResponse
    Job:
      properties:
        employer:
          type: string
          title: Employer
        start_date:
          type: string
          title: Start Date
        end_date:
          type: string
          title: End Date
        federal_entity:
          type: string
          title: Federal Entity
        base_salary:
          type: number
          title: Base Salary
        monthly_salary:
          type: number
          title: Monthly Salary
        employer_registration:
          type: string
          title: Employer Registration
      type: object
      required:
      - employer
      - start_date
      - end_date
      - federal_entity
      - base_salary
      - monthly_salary
      title: Job
