          type: string
          format: uuid
          title: Account Id
        user_id:
          type: string
          format: uuid
          title: User Id
        identifier:
          type: string
          title: Identifier
        data_types:
          items:
            $ref: '#/components/schemas/DebugDataType'
          type: array
      type: object
      required:
      - account_id
      - user_id
      title: DebugDataArgyleParams
      example:
        account_id: f1932f34-2658-4f3e-8069-0aeeb77dd14e
        user_id: db48d579-c10d-4ed6-b857-1b1b7f4502c0
        data_types:
        - token
        - webhooks
    AccountDataBaseResponse:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        country:
          $ref: '#/components/schemas/CountryCode'
        platform:
          $ref: '#/components/schemas/PlatformCode'
        account_id:
          type: string
          format: uuid
          title: Account Id
        next_step:
          $ref: '#/components/schemas/LoginTypes'
        methods:
          items:
            $ref: '#/components/schemas/LoginTypes'
          type: array
          default: []
        alternative_methods:
          items:
            $ref: '#/components/schemas/LoginTypes'
          type: array
          default: []
        hint:
          type: string
          title: Hint
      type: object
      title: AccountDataBaseResponse
      example:
        user_id: 9334389a-c93c-4183-9894-ea8eb72f82e8
        country: mx
        platform: uber
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    DebugDataType:
      enum:
      - token
      - account
      - data
      - webhooks
      title: DebugDataType
      description: An enumeration.
    BaseResponse_AccountBaseResponse_:
      properties:
        success:
          type: boolean
          title: Success
          default: true
        error:
          $ref: '#/components/schemas/ErrorResponse'
        data:
          $ref: '#/components/schemas/AccountBaseResponse'
      type: object
      title: BaseResponse[AccountBaseResponse]
      example:
        success: true
        data: {}
        error: {}
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        errors:
          items:
            $ref: '#/components/schemas/ErrorDetailResponse'
          type: array
          title: Errors
      type: object
      title: ErrorResponse
    RefreshArgyleTokenParams:
      properties:
        argyle_user_id:
          type: string
          title: Argyle User Id
      type: object
      required:
      - argyle_user_id
      title: RefreshArgyleTokenParams
      example:
        argyle_user_id: 018e1234-5678-9abc-def0-123456789abc
    CreateUserArgyleParams:
      properties:
        user_id:
          type: string
          title: User Id
        country:
          $ref: '#/components/schemas/CountryCode'
        platform:
          $ref: '#/components/schemas/PlatformCode'
        identifier:
          type: string
          title: Identifier
        gov_id:
          type: string
          title: Gov Id
        redirect_url:
          type: string
          title: Redirect Url
      type: object
      title: CreateUserArgyleParams
      example:
        user_id: 2b0956a2-58e7-4e97-804d-2852d40f05d7
        country: mx
        platform: uber
